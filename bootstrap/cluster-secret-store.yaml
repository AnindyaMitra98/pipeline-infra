# Cluster-wide binding between External Secrets Operator and AWS Secrets
# Manager. ${AWS_REGION} is substituted by install.ps1 from the Terraform
# output, so the region is never hardcoded in the repo.
#
# Authentication is implicit: ESO's pod assumes its IRSA role via the
# ServiceAccount annotation, so there are no AWS credentials in this manifest
# and none in the cluster. The role can read only pipeline-app/* secrets.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
